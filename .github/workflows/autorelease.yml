name: Auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: autorelease
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip-release]') }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
        with:
          distribution: temurin
          java-version: '21'

      - name: Bump patch version, tag, and push
        run: |
          old=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n1)
          new=$(echo "$old" | awk -F. '{print $1"."$2"."($3+1)}')
          sed -i "0,/<version>$old<\/version>/s//<version>$new<\/version>/" pom.xml
          sed -i "0,/<version>$old<\/version>/s//<version>$new<\/version>/" adaptiveflow-core/pom.xml
          git config user.name "AdaptiveFlow Release Bot"
          git config user.email "171715285+Varun-51@users.noreply.github.com"
          git add pom.xml adaptiveflow-core/pom.xml
          git commit -m "Bump version to $new [skip-release]"
          git tag "v$new"
          git push origin main
          git push origin "v$new"
          echo "Bumped to $new"

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode > /tmp/af-private.key
          gpg --batch --import /tmp/af-private.key
          KeyID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="sec" {print $5}' | head -n1)
          echo "Imported secret key: ${KeyID}"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Maven settings
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${SONATYPE_TOKEN_USERNAME}</username>
                <password>${SONATYPE_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}

      - name: Deploy to Maven Central
        run: ./mvnw --batch-mode --no-transfer-progress clean deploy -P release -Dgpg.passphrase="$GPG_PASSPHRASE"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}